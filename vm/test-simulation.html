<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>VM Test Simulation</title>
<style>
body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
.test-section { margin: 20px 0; padding: 15px; border: 1px solid #0f0; }
.test-result { margin: 10px 0; padding: 5px; }
.success { color: #0f0; }
.error { color: #f00; }
.info { color: #ff0; }
button { padding: 10px; margin: 5px; cursor: pointer; }
#output { background: #111; padding: 10px; height: 400px; overflow-y: auto; }
</style>
</head>
<body>

<h1>VM Test Simulation</h1>
<p>This page tests VM functionality step by step</p>

<div class="test-section">
    <h2>Test Controls</h2>
    <button onclick="runAllTests()">Run All Tests</button>
    <button onclick="testV86Load()">Test V86 Load</button>
    <button onclick="testVMBoot()">Test VM Boot</button>
    <button onclick="testCommands()">Test Commands</button>
    <button onclick="clearOutput()">Clear</button>
</div>

<div class="test-section">
    <h2>Test Output</h2>
    <div id="output"></div>
</div>

<iframe id="vmFrame" src="https://teslasolar.github.io/ignition-sandbox/vm/" style="display:none;"></iframe>

<script>
const output = document.getElementById('output');
const vmFrame = document.getElementById('vmFrame');
let testResults = [];

function log(msg, type = 'info') {
    const time = new Date().toTimeString().split(' ')[0];
    const div = document.createElement('div');
    div.className = `test-result ${type}`;
    div.textContent = `[${time}] ${msg}`;
    output.appendChild(div);
    output.scrollTop = output.scrollHeight;
    console.log(msg);
}

function clearOutput() {
    output.innerHTML = '';
    testResults = [];
}

async function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

// Test 1: Check if V86 loads
async function testV86Load() {
    log('Test 1: Checking V86 emulator load...', 'info');

    try {
        // Check if frame loaded
        const frameLoaded = vmFrame.contentWindow !== null;
        log(`  Frame loaded: ${frameLoaded}`, frameLoaded ? 'success' : 'error');

        // Try to check V86 in iframe
        let v86Status = false;
        try {
            // Send message to check status
            const response = await sendMessage({
                type: 'vm-command',
                action: 'status'
            });

            if (response) {
                log(`  VM Status Response: ${JSON.stringify(response.data)}`, 'success');
                v86Status = response.data?.v86Ready || false;
            }
        } catch (e) {
            log(`  Could not check V86 status: ${e.message}`, 'error');
        }

        testResults.push({
            test: 'V86 Load',
            passed: v86Status
        });

        return v86Status;
    } catch (error) {
        log(`  Error: ${error.message}`, 'error');
        return false;
    }
}

// Test 2: Boot Alpine Linux
async function testVMBoot() {
    log('Test 2: Booting Alpine Linux...', 'info');

    try {
        const response = await sendMessage({
            type: 'vm-command',
            action: 'boot',
            params: { distro: 'alpine' }
        });

        if (response && !response.error) {
            log(`  Boot initiated: ${JSON.stringify(response.data)}`, 'success');

            // Wait for boot
            log('  Waiting 10 seconds for boot...', 'info');
            await wait(10000);

            // Check status
            const status = await sendMessage({
                type: 'vm-command',
                action: 'status'
            });

            if (status && status.data?.running) {
                log(`  VM is running! Status: ${status.data.status}`, 'success');
                testResults.push({ test: 'VM Boot', passed: true });
                return true;
            } else {
                log(`  VM not running yet`, 'error');
                testResults.push({ test: 'VM Boot', passed: false });
                return false;
            }
        } else {
            log(`  Boot failed: ${response?.error || 'No response'}`, 'error');
            testResults.push({ test: 'VM Boot', passed: false });
            return false;
        }
    } catch (error) {
        log(`  Error: ${error.message}`, 'error');
        testResults.push({ test: 'VM Boot', passed: false });
        return false;
    }
}

// Test 3: Send commands
async function testCommands() {
    log('Test 3: Testing keyboard commands...', 'info');

    const commands = [
        'uname -a',
        'echo "Hello from test"',
        'ls /',
        'free -h'
    ];

    let allPassed = true;

    for (const cmd of commands) {
        log(`  Sending: ${cmd}`, 'info');

        try {
            const response = await sendMessage({
                type: 'vm-command',
                action: 'command',
                params: { cmd: cmd + '\n' }
            });

            if (response && !response.error) {
                log(`    ✓ Sent successfully`, 'success');
            } else {
                log(`    ✗ Failed: ${response?.error || 'No response'}`, 'error');
                allPassed = false;
            }

            await wait(1000);
        } catch (error) {
            log(`    ✗ Error: ${error.message}`, 'error');
            allPassed = false;
        }
    }

    testResults.push({
        test: 'Keyboard Commands',
        passed: allPassed
    });

    return allPassed;
}

// Send message to VM iframe
function sendMessage(message) {
    return new Promise((resolve, reject) => {
        const timeout = setTimeout(() => {
            window.removeEventListener('message', handler);
            reject(new Error('Timeout waiting for response'));
        }, 5000);

        const handler = (event) => {
            if (event.data && event.data.type === 'vm-response') {
                clearTimeout(timeout);
                window.removeEventListener('message', handler);
                resolve(event.data);
            }
        };

        window.addEventListener('message', handler);
        vmFrame.contentWindow.postMessage(message, '*');
    });
}

// Run all tests
async function runAllTests() {
    clearOutput();
    log('Starting comprehensive VM test suite...', 'info');
    log('=' .repeat(50), 'info');

    // Give iframe time to load
    log('Waiting for iframe to load...', 'info');
    await wait(3000);

    // Test 1: V86 Load
    const v86Loaded = await testV86Load();
    await wait(1000);

    // Test 2: VM Boot (only if V86 loaded)
    let vmBooted = false;
    if (v86Loaded) {
        vmBooted = await testVMBoot();
    } else {
        log('Skipping boot test - V86 not loaded', 'error');
    }

    // Test 3: Commands (only if VM booted)
    let commandsWork = false;
    if (vmBooted) {
        await wait(5000); // Extra wait for VM to fully initialize
        commandsWork = await testCommands();
    } else {
        log('Skipping command test - VM not booted', 'error');
    }

    // Summary
    log('', 'info');
    log('=' .repeat(50), 'info');
    log('Test Summary:', 'info');

    let passed = 0;
    let failed = 0;

    testResults.forEach(result => {
        const status = result.passed ? '✅' : '❌';
        const className = result.passed ? 'success' : 'error';
        log(`  ${status} ${result.test}`, className);

        if (result.passed) passed++;
        else failed++;
    });

    log('', 'info');
    log(`Total: ${testResults.length} | Passed: ${passed} | Failed: ${failed}`, 'info');

    const successRate = testResults.length > 0 ?
        ((passed / testResults.length) * 100).toFixed(0) : 0;

    if (successRate >= 66) {
        log(`Success Rate: ${successRate}% ✅`, 'success');
    } else {
        log(`Success Rate: ${successRate}% ❌`, 'error');
    }
}

// Auto-run tests on load
window.addEventListener('load', () => {
    log('Test page loaded. Click "Run All Tests" to begin.', 'info');
});
</script>

</body>
</html>
