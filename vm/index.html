<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ignition Sandbox VM</title>
<style>
/* Base styles */
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0d1117; color: #c9d1d9; font-family: monospace; height: 100vh; overflow: hidden; }

/* Loading screen */
#loader { position: fixed; inset: 0; background: #0d1117; display: flex; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.3s; }
#loader.hidden { opacity: 0; pointer-events: none; }
.loader-text { color: #58a6ff; font-size: 18px; animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

/* Dynamic view container */
#app { height: 100vh; display: flex; flex-direction: column; opacity: 0; transition: opacity 0.3s; }
#app.loaded { opacity: 1; }

/* VM specific styles */
.header { background: #161b22; padding: 10px 20px; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
.header h1 { font-size: 16px; color: #58a6ff; }
.controls { display: flex; gap: 10px; align-items: center; }
.btn { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
.btn:hover { background: #30363d; }
.btn.danger { background: #da3633; border-color: #da3633; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.status { font-size: 12px; color: #8b949e; }
.status.running { color: #3fb950; }
.status.loading { color: #f0883e; }

/* Main layout */
.main { flex: 1; display: flex; overflow: hidden; }
.terminal-container { flex: 1; background: #000; position: relative; display: flex; align-items: center; justify-content: center; }
#screen { width: 100%; height: 100%; background: #000; }

/* Boot overlay */
.boot-overlay { position: absolute; inset: 0; background: rgba(13,17,23,0.98); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
.boot-overlay.hidden { display: none; }
.boot-title { font-size: 22px; color: #58a6ff; margin-bottom: 8px; }
.boot-subtitle { color: #8b949e; margin-bottom: 25px; }
.boot-options { display: flex; flex-direction: column; gap: 8px; width: 380px; }
.boot-option { background: #21262d; border: 1px solid #30363d; border-radius: 6px; padding: 12px; cursor: pointer; text-align: left; }
.boot-option:hover { border-color: #58a6ff; background: #30363d; }
.boot-option h4 { color: #c9d1d9; margin-bottom: 4px; font-size: 14px; }
.boot-option p { color: #8b949e; font-size: 11px; margin: 0; }
.boot-option .tag { display: inline-block; background: #238636; color: #fff; font-size: 9px; padding: 2px 5px; border-radius: 3px; margin-left: 6px; }

/* Progress */
.progress-container { width: 380px; margin-top: 15px; display: none; }
.progress-container.active { display: block; }
.progress-bar { height: 4px; background: #21262d; border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: #58a6ff; width: 0%; transition: width 0.3s; }

/* Boot log */
.boot-log { margin-top: 12px; font-size: 10px; color: #8b949e; max-height: 120px; overflow-y: auto; text-align: left; width: 380px; background: #161b22; padding: 8px; border-radius: 4px; border: 1px solid #30363d; }
.boot-log .error { color: #f85149; }
.boot-log .success { color: #3fb950; }
.boot-log .info { color: #58a6ff; }

/* Sidebar */
.sidebar { width: 280px; background: #161b22; border-left: 1px solid #30363d; padding: 12px; overflow-y: auto; }
.sidebar h3 { color: #7ee787; font-size: 12px; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid #30363d; }
.info-row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; }
.info-row .label { color: #8b949e; }
.quick-cmd { background: #21262d; border: 1px solid #30363d; border-radius: 4px; padding: 6px; margin-bottom: 5px; cursor: pointer; font-size: 10px; }
.quick-cmd:hover { border-color: #58a6ff; }
.quick-cmd .cmd-name { color: #58a6ff; margin-bottom: 2px; }
.quick-cmd code { color: #7ee787; font-size: 10px; }

/* Monitor view styles */
.dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; padding: 20px; }
.card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; }
.card h2 { color: #7ee787; font-size: 14px; margin-bottom: 10px; border-bottom: 1px solid #30363d; padding-bottom: 5px; }

/* Alarm styles */
.alarm { padding: 10px; margin: 5px 0; border-radius: 4px; position: relative; animation: fadeIn 0.3s; }
.alarm.critical { background: rgba(255,68,68,0.2); border-left: 4px solid #ff4444; }
.alarm.warning { background: rgba(255,153,68,0.2); border-left: 4px solid #ff9944; }
.alarm.info { background: rgba(68,153,255,0.2); border-left: 4px solid #4499ff; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

/* Error notifications */
#error-alarms { position: fixed; top: 10px; right: 10px; width: 400px; z-index: 10000; font-family: monospace; }
</style>
</head>
<body>

<div id="loader">
  <div class="loader-text">Loading Ignition Sandbox...</div>
</div>

<div id="app"></div>

<script>
/**
 * Ignition Sandbox VM - Unified View System
 * Loads views from JSON configurations
 */

class VMApp {
  constructor() {
    this.currentView = null;
    this.viewCache = {};
    this.emulator = null;
    this.running = false;
    this.config = null;
  }

  async init() {
    console.log('[App] Initializing...');

    // Get view from URL params or default to main
    const params = new URLSearchParams(window.location.search);
    const view = params.get('view') || 'main';

    // Load view
    await this.loadView(view);

    // Hide loader
    document.getElementById('loader').classList.add('hidden');
    document.getElementById('app').classList.add('loaded');
  }

  async loadView(viewName) {
    console.log(`[App] Loading view: ${viewName}`);

    try {
      // Check cache first
      if (this.viewCache[viewName]) {
        this.config = this.viewCache[viewName];
      } else {
        // Load from JSON
        const response = await fetch(`../screens/vm/${viewName}.json`);
        if (!response.ok) throw new Error(`View not found: ${viewName}`);

        this.config = await response.json();
        this.viewCache[viewName] = this.config;
      }

      this.currentView = viewName;
      this.renderView();

      // Initialize view-specific functionality
      if (viewName === 'main') {
        await this.initVM();
      } else if (viewName === 'monitor') {
        await this.initMonitor();
      } else if (viewName === 'api') {
        await this.initAPI();
      } else if (viewName === 'health') {
        await this.initHealth();
      }

    } catch (error) {
      console.error('[App] Failed to load view:', error);
      this.renderError(error.message);
    }
  }

  renderView() {
    const app = document.getElementById('app');

    if (this.config.type === 'vm-emulator') {
      app.innerHTML = this.renderVMView();
    } else if (this.config.type === 'monitoring') {
      app.innerHTML = this.renderMonitorView();
    } else if (this.config.type === 'api-documentation') {
      app.innerHTML = this.renderAPIView();
    } else if (this.config.type === 'health-monitor') {
      app.innerHTML = this.renderHealthView();
    } else {
      app.innerHTML = `<div class="error">Unknown view type: ${this.config.type}</div>`;
    }
  }

  renderVMView() {
    const config = this.config;
    const header = config.components.header;
    const bootOpts = config.components.bootOptions;
    const sidebar = config.components.sidebar;

    return `
      <div class="header">
        <h1>${header.title}</h1>
        <div class="controls">
          ${header.controls.map(ctrl =>
            ctrl.type === 'status' ?
              `<span class="status" id="${ctrl.id}">${ctrl.text}</span>` :
              `<button class="btn ${ctrl.class || ''}" id="${ctrl.id}" onclick="${ctrl.action}" ${ctrl.disabled ? 'disabled' : ''}>${ctrl.text}</button>`
          ).join('')}
        </div>
      </div>
      <div class="main">
        <div class="terminal-container">
          <div id="screen"></div>
          <div class="boot-overlay" id="bootOverlay">
            <div class="boot-title">${bootOpts.title}</div>
            <div class="boot-subtitle">${bootOpts.subtitle}</div>
            <div class="boot-options" id="bootOptions">
              ${bootOpts.sections.map(section => `
                <div style="font-size:10px;color:#8b949e;margin-bottom:8px">${section.label}</div>
                ${section.options.map(opt => `
                  <div class="boot-option" onclick="${opt.action}">
                    <h4>${opt.title} ${opt.tag ? `<span class="tag">${opt.tag}</span>` : ''}</h4>
                    <p>${opt.description}</p>
                  </div>
                `).join('')}
              `).join('')}
            </div>
            <div class="progress-container" id="progressContainer">
              <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            </div>
            <div class="boot-log" id="bootLog"></div>
          </div>
        </div>
        <div class="sidebar">
          ${sidebar.sections.map(section => `
            <h3>${section.title}</h3>
            ${section.type === 'info' ?
              section.items.map(item => `
                <div class="info-row">
                  <span class="label">${item.label}</span>
                  <span id="${item.id || ''}">${item.value}</span>
                </div>
              `).join('') :
              section.items.map(item => `
                <div class="quick-cmd" onclick="VM.type('${item.cmd}')">
                  <div class="cmd-name">${item.name}</div>
                  <code>${item.cmd.replace('\\n', '')}</code>
                </div>
              `).join('')
            }
          `).join('')}
          <p style="font-size:10px;color:#8b949e;margin-top:10px">${sidebar.footer}</p>
        </div>
      </div>
    `;
  }

  renderMonitorView() {
    const config = this.config;
    return `
      <div style="padding: 20px;">
        <h1>${config.components.header.title}</h1>
        <p>${config.components.header.subtitle}</p>
        <div class="controls">
          ${config.components.controls.map(btn =>
            `<button onclick="${btn.action}()">${btn.text}</button>`
          ).join('')}
        </div>
        <div class="dashboard">
          ${config.components.cards.map(card =>
            `<div class="card"><h2>${card.title}</h2><div id="${card.id}"></div></div>`
          ).join('')}
        </div>
      </div>
    `;
  }

  renderAPIView() {
    return `<div style="padding: 20px;"><h1>API Documentation</h1><p>API view implementation</p></div>`;
  }

  renderHealthView() {
    return `<div style="padding: 20px;"><h1>Health Monitor</h1><p>Health monitoring view</p></div>`;
  }

  renderError(message) {
    document.getElementById('app').innerHTML = `
      <div style="padding: 20px; color: #f85149;">
        <h1>Error</h1>
        <p>${message}</p>
        <button onclick="location.reload()">Reload</button>
      </div>
    `;
  }

  async initVM() {
    console.log('[VM] Initializing VM functionality...');

    // Load error monitor
    await this.loadScript('error-monitor.js');

    // Load V86 emulator
    await this.loadV86();

    // Setup VM object
    this.setupVM();
  }

  async loadScript(src) {
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = src;
      script.onload = resolve;
      script.onerror = reject;
      document.head.appendChild(script);
    });
  }

  async loadV86() {
    console.log('[V86] Loading v86 emulator...');

    return new Promise((resolve) => {
      const script = document.createElement('script');
      script.src = 'https://copy.sh/v86/build/libv86.js';

      script.onload = () => {
        console.log('[V86] Script loaded');
        setTimeout(() => {
          if (typeof V86Starter !== 'undefined') {
            console.log('[V86] V86Starter available');
            this.updateBootLog('✓ V86 emulator ready', 'success');
            resolve();
          } else if (typeof V86 !== 'undefined') {
            console.log('[V86] V86 constructor available');
            window.V86Starter = V86;
            this.updateBootLog('✓ V86 emulator ready (using V86)', 'success');
            resolve();
          } else {
            console.error('[V86] Not found');
            this.updateBootLog('🚨 [V86_LOAD_FAIL] V86 emulator not found', 'error');
            resolve();
          }
        }, 100);
      };

      script.onerror = () => {
        console.error('[V86] Failed to load');
        this.updateBootLog('🚨 [V86_LOAD_FAIL] Failed to load V86', 'error');
        resolve();
      };

      document.head.appendChild(script);
    });
  }

  updateBootLog(msg, type = 'info') {
    const log = document.getElementById('bootLog');
    if (log) {
      log.innerHTML += `<div class="${type}">${msg}</div>`;
      log.scrollTop = log.scrollHeight;
    }
  }

  setupVM() {
    // Global VM object for compatibility
    window.VM = {
      emulator: null,
      running: false,
      app: this,

      isV86Ready() {
        return typeof V86Starter === 'function';
      },

      log(msg, type = 'info') {
        this.app.updateBootLog(msg, type);
      },

      setProgress(p) {
        const fill = document.getElementById('progressFill');
        if (fill) fill.style.width = p + '%';
      },

      setStatus(text, className = '') {
        const status = document.getElementById('vmStatus');
        if (status) {
          status.textContent = text;
          status.className = 'status ' + className;
        }
      },

      async bootLinux(distro) {
        if (!this.isV86Ready()) {
          this.log('V86 not ready', 'error');
          return;
        }

        document.getElementById('bootOptions').style.display = 'none';
        document.getElementById('progressContainer').classList.add('active');

        const config = this.app.config.resources.distros[distro];
        if (!config) {
          this.log('Unknown distro: ' + distro, 'error');
          return;
        }

        this.log(`Loading ${config.name}...`);
        this.setProgress(20);

        try {
          const options = {
            wasm_path: this.app.config.resources.wasm,
            memory_size: config.memory,
            vga_memory_size: config.vga_memory,
            screen_container: document.getElementById('screen'),
            bios: { url: this.app.config.resources.bios.seabios },
            vga_bios: { url: this.app.config.resources.bios.vgabios },
            cdrom: { url: config.cdrom },
            autostart: true,
            uart1: true,
            uart2: true,
            boot_order: 0x213
          };

          this.emulator = new V86Starter(options);

          this.emulator.add_listener('emulator-ready', () => {
            this.log('VM started!', 'success');
            this.setProgress(100);
            this.running = true;
            this.setStatus(`Running: ${config.name}`, 'running');
            document.getElementById('restartBtn').disabled = false;
            document.getElementById('stopBtn').disabled = false;
            setTimeout(() => {
              document.getElementById('bootOverlay').classList.add('hidden');
            }, 500);
          });
        } catch(e) {
          this.log('Error: ' + e.message, 'error');
        }
      },

      bootSector(profile) {
        // Similar to bootLinux but for boot sectors
        console.log('Boot sector:', profile);
      },

      stop() {
        if (this.emulator) {
          this.emulator.stop();
          this.emulator.destroy();
          this.emulator = null;
        }
        this.running = false;
        this.setStatus('Stopped', '');
        document.getElementById('bootOverlay').classList.remove('hidden');
        document.getElementById('bootOptions').style.display = 'flex';
        document.getElementById('progressContainer').classList.remove('active');
      },

      restart() {
        if (this.emulator) {
          this.emulator.restart();
        }
      },

      type(text) {
        if (this.emulator && this.running) {
          this.emulator.keyboard_send_text(text);
        }
      }
    };

    // Message handler for API
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'vm-command') {
        this.handleVMCommand(event.data, event.source, event.origin);
      }
    });
  }

  handleVMCommand(command, source, origin) {
    const response = { type: 'vm-response', action: command.action, timestamp: Date.now() };

    try {
      switch(command.action) {
        case 'status':
          response.data = {
            running: VM.running,
            emulator: !!VM.emulator,
            v86Ready: VM.isV86Ready()
          };
          break;
        case 'boot':
          VM.bootLinux(command.params.distro);
          response.data = { booting: command.params.distro };
          break;
        case 'command':
          VM.type(command.params.cmd || command.params.text);
          response.data = { sent: true };
          break;
        case 'stop':
          VM.stop();
          response.data = { stopped: true };
          break;
        default:
          response.error = 'Unknown action';
      }
    } catch(e) {
      response.error = e.message;
    }

    if (source && source.postMessage) {
      source.postMessage(response, origin);
    }
  }

  async initMonitor() {
    console.log('[Monitor] Initializing monitoring...');
    await this.loadScript('error-monitor.js');
  }

  async initAPI() {
    console.log('[API] Initializing API view...');
  }

  async initHealth() {
    console.log('[Health] Initializing health monitoring...');
  }
}

// Initialize app
const app = new VMApp();
window.addEventListener('DOMContentLoaded', () => app.init());
</script>

</body>
</html>
