name: Build Custom WebVM Image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'Ignition-linux-x64-installer.run'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if Ignition installer exists
        id: check_installer
        run: |
          if [ -f "Ignition-linux-x64-installer.run" ]; then
            echo "installer_exists=true" >> $GITHUB_OUTPUT
            echo "✅ Ignition installer found"
          else
            echo "installer_exists=false" >> $GITHUB_OUTPUT
            echo "❌ Ignition installer not found"
            echo "Please download from https://inductiveautomation.com/downloads/ignition/"
            echo "and add to repo as: Ignition-linux-x64-installer.run"
          fi

      - name: Set up Docker Buildx
        if: steps.check_installer.outputs.installer_exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.check_installer.outputs.installer_exists == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.check_installer.outputs.installer_exists == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        if: steps.check_installer.outputs.installer_exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create deployment summary
        if: steps.check_installer.outputs.installer_exists == 'true'
        run: |
          echo "## 🎉 Custom WebVM Image Built!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. **Make package public:**" >> $GITHUB_STEP_SUMMARY
          echo "   - Go to: https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }}" >> $GITHUB_STEP_SUMMARY
          echo "   - Click 'Package settings'" >> $GITHUB_STEP_SUMMARY
          echo "   - Change visibility to 'Public'" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "2. **Test your image:**" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "   https://webvm.io/?image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "3. **Deploy to GitHub Pages:**" >> $GITHUB_STEP_SUMMARY
          echo "   - Enable Pages in repo settings" >> $GITHUB_STEP_SUMMARY
          echo "   - Select branch: \`gh-pages\` or \`main\`" >> $GITHUB_STEP_SUMMARY
          echo "   - Visit: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" >> $GITHUB_STEP_SUMMARY

      - name: Installation instructions
        if: steps.check_installer.outputs.installer_exists == 'false'
        run: |
          echo "## ❌ Build Skipped - Installer Missing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download Ignition:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Visit: https://inductiveautomation.com/downloads/ignition/" >> $GITHUB_STEP_SUMMARY
          echo "2. Download: **Linux x64 installer** (.run file)" >> $GITHUB_STEP_SUMMARY
          echo "3. Rename to: \`Ignition-linux-x64-installer.run\`" >> $GITHUB_STEP_SUMMARY
          echo "4. Add to repository root" >> $GITHUB_STEP_SUMMARY
          echo "5. Commit and push" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The workflow will automatically rebuild when the installer is added." >> $GITHUB_STEP_SUMMARY
          exit 1
