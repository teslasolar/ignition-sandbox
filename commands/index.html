<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Commands | Konomi IgnAIte</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Consolas,monospace}body{background:#0d1117;color:#c9d1d9;padding:20px}.h{color:#f97316;border-bottom:2px solid #f97316;padding-bottom:10px;margin-bottom:20px}.t{width:100%;border-collapse:collapse;margin-top:15px}.t th,.t td{border:1px solid #30363d;padding:8px;text-align:left;font-size:12px}.t th{background:#161b22;color:#f97316}.t tr:hover{background:rgba(249,115,22,.1)}.b{margin-top:20px}.b a{color:#f97316;text-decoration:none}</style>
</head><body>
<h1 class="h">⚡ Commands</h1>
<table class="t" id="tbl"><tr><th>Name</th><th>Category</th><th>Description</th></tr></table>
<div class="b"><a href="../">← Back to IgnAIte</a></div>
<script>
fetch('commands.csv').then(r=>r.text()).then(csv=>{
  const rows=csv.trim().split('\n').slice(1);
  const tbl=document.getElementById('tbl');
  rows.forEach(r=>{const[n,c,d]=r.split(',');tbl.innerHTML+=`<tr><td>${n}</td><td>${c}</td><td>${d}</td></tr>`;});
});
</script>
</body></html>
