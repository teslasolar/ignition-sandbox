<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Templates | Konomi IgnAIte</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Consolas,monospace}body{background:#0d1117;color:#c9d1d9;padding:20px}.h{color:#f97316;border-bottom:2px solid #f97316;padding-bottom:10px;margin-bottom:20px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px}.c{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:15px;cursor:pointer}.c:hover{border-color:#f97316}.c h3{color:#f97316;font-size:14px;margin-bottom:5px}.c p{color:#8b949e;font-size:11px}.b{margin-top:20px}.b a{color:#f97316;text-decoration:none}</style>
</head><body>
<h1 class="h">📋 Templates</h1>
<div class="g" id="list"></div>
<div class="b"><a href="../">← Back to IgnAIte</a></div>
<script>
fetch('index.json').then(r=>r.json()).then(d=>{
  const el=document.getElementById('list');
  (d.children||['commands','tabs','views']).forEach(c=>{
    el.innerHTML+=`<div class="c" onclick="location='${c}/'"><h3>📁 ${c}</h3><p>Browse ${c}</p></div>`;
  });
});
</script>
</body></html>
