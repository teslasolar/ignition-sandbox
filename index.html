<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ignition Sandbox</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font: 16px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            padding: 40px 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #58a6ff; margin-bottom: 10px; }
        h2 { color: #7ee787; margin: 30px 0 15px; font-size: 18px; border-bottom: 1px solid #30363d; padding-bottom: 8px; }
        h3 { color: #f0f6fc; font-size: 14px; margin: 15px 0 10px; }
        p { color: #8b949e; margin-bottom: 15px; }
        a { color: #58a6ff; }

        .cmd {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px 15px;
            margin: 8px 0;
            position: relative;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .cmd:hover { border-color: #58a6ff; }
        .cmd code {
            display: block;
            color: #7ee787;
            font-family: 'SF Mono', Consolas, monospace;
            font-size: 13px;
            word-break: break-all;
        }
        .cmd .label {
            color: #c9d1d9;
            font-size: 13px;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .cmd .desc {
            color: #8b949e;
            font-size: 12px;
            margin-top: 4px;
        }
        .cmd button {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        .cmd button:hover { background: #30363d; }
        .cmd button.copied { background: #238636; border-color: #238636; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin: 15px 0;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 15px;
        }
        .card.highlight { border-color: #238636; }
        .card h4 { color: #f0f6fc; font-size: 14px; margin-bottom: 6px; }
        .card h4 a.highlight { color: #3fb950; }
        .card p { font-size: 13px; margin: 0; }
        .card code { color: #7ee787; font-size: 12px; }
        .card .note { color: #7ee787; font-size: 12px; display: block; margin-top: 4px; }

        .tabs { display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap; }
        .tab {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .tab:hover, .tab.active { background: #30363d; border-color: #58a6ff; }
        .tab.highlight { background: #238636; border-color: #238636; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .info-list { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 15px; }
        .info-list p { margin: 5px 0; font-size: 13px; }

        .loading { color: #8b949e; text-align: center; padding: 40px; }
        .footer { margin-top: 40px; color: #8b949e; font-size: 13px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ignition Sandbox</h1>
        <p>Command reference for Linux environments. Click any command to copy.</p>

        <div class="tabs" id="tabs">
            <div class="loading">Loading...</div>
        </div>

        <div id="content">
            <div class="loading">Loading templates...</div>
        </div>

        <h2>Resources</h2>
        <div class="grid" id="resources">
            <div class="loading">Loading...</div>
        </div>

        <div class="footer">
            <p>All scripts fetch from this repo and run on Debian/Ubuntu Linux.</p>
        </div>
    </div>

    <script>
        const App = {
            manifest: null,
            cache: {},

            async init() {
                try {
                    this.manifest = await this.loadJSON('templates/manifest.json');
                    this.renderTabs();
                    this.renderResources();
                    // Load first tab
                    if (this.manifest.tabs.length > 0) {
                        this.showTab(this.manifest.tabs[0].id);
                    }
                } catch (e) {
                    console.error('Failed to load manifest:', e);
                    document.getElementById('content').innerHTML =
                        '<div class="loading">Failed to load. Check console.</div>';
                }
            },

            async loadJSON(path) {
                if (this.cache[path]) return this.cache[path];
                const res = await fetch(path);
                if (!res.ok) throw new Error(`Failed to load ${path}`);
                const data = await res.json();
                this.cache[path] = data;
                return data;
            },

            renderTabs() {
                const container = document.getElementById('tabs');
                container.innerHTML = this.manifest.tabs.map(tab =>
                    `<button class="tab${tab.highlight ? ' highlight' : ''}"
                             onclick="App.showTab('${tab.id}')"
                             data-tab="${tab.id}">${tab.label}</button>`
                ).join('');
            },

            renderResources() {
                const container = document.getElementById('resources');
                container.innerHTML = this.manifest.resources.map(r =>
                    `<div class="card${r.highlight ? ' highlight' : ''}">
                        <h4><a href="${r.href}"${r.highlight ? ' class="highlight"' : ''}>${r.title}</a></h4>
                        <p>${r.description}</p>
                    </div>`
                ).join('');
            },

            async showTab(id) {
                // Update tab active state
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelector(`[data-tab="${id}"]`)?.classList.add('active');

                const tab = this.manifest.tabs.find(t => t.id === id);
                if (!tab) return;

                const container = document.getElementById('content');
                container.innerHTML = '<div class="loading">Loading...</div>';

                try {
                    const data = await this.loadJSON('templates/' + tab.src);
                    container.innerHTML = this.renderTabContent(data);
                } catch (e) {
                    container.innerHTML = `<div class="loading">Failed to load tab: ${e.message}</div>`;
                }
            },

            renderTabContent(data) {
                let html = `<div class="tab-content active">`;
                html += `<h2>${data.title}</h2>`;

                if (data.description) {
                    html += `<p>${data.description}</p>`;
                }

                // Command-type tabs (ignition, tailscale, system, setup)
                if (data.commands) {
                    html += this.renderCommands(data.commands);
                }

                // Custom tabs with sections (designer, vm)
                if (data.sections) {
                    html += this.renderSections(data.sections);
                }

                html += '</div>';
                return html;
            },

            renderCommands(commands) {
                return commands.map(cmd =>
                    `<div class="cmd" onclick="App.copyCode(this)">
                        <div class="label">${cmd.label}</div>
                        <code>${cmd.code}</code>
                        ${cmd.description ? `<div class="desc">${cmd.description}</div>` : ''}
                        <button>Copy</button>
                    </div>`
                ).join('');
            },

            renderSections(sections) {
                return sections.map(section => {
                    let html = '';
                    if (section.title) {
                        html += `<h3>${section.title}</h3>`;
                    }

                    if (section.type === 'cards') {
                        html += '<div class="grid">';
                        html += section.items.map(item =>
                            `<div class="card${item.highlight ? ' highlight' : ''}">
                                <h4>${item.href ?
                                    `<a href="${item.href}"${item.target ? ` target="${item.target}"` : ''}${item.highlight ? ' class="highlight"' : ''}>${item.title}</a>` :
                                    item.title}</h4>
                                <p>${item.description}</p>
                                ${item.note ? `<code class="note">${item.note}</code>` : ''}
                            </div>`
                        ).join('');
                        html += '</div>';
                    }

                    if (section.type === 'commands') {
                        html += '<div class="grid">';
                        html += section.items.map(item =>
                            `<div class="cmd" onclick="App.copyCode(this)">
                                <div class="label">${item.label}</div>
                                <code>${item.code}</code>
                                <button>Copy</button>
                            </div>`
                        ).join('');
                        html += '</div>';
                    }

                    if (section.type === 'info') {
                        html += '<div class="info-list">';
                        html += section.content.map(line => `<p>${line}</p>`).join('');
                        html += '</div>';
                    }

                    return html;
                }).join('');
            },

            copyCode(el) {
                const code = el.querySelector('code').textContent;
                const btn = el.querySelector('button');
                navigator.clipboard.writeText(code).then(() => {
                    btn.textContent = 'Copied!';
                    btn.classList.add('copied');
                    setTimeout(() => {
                        btn.textContent = 'Copy';
                        btn.classList.remove('copied');
                    }, 2000);
                });
            }
        };

        // Initialize on load
        App.init();
    </script>
</body>
</html>
