<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ignition Sandbox</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:16px/1.6 -apple-system,sans-serif;background:#0d1117;color:#c9d1d9;padding:40px 20px}
.container{max-width:900px;margin:0 auto}
h1{color:#58a6ff;margin-bottom:10px}
h2{color:#7ee787;margin:30px 0 15px;font-size:18px;border-bottom:1px solid #30363d;padding-bottom:8px}
h3{color:#f0f6fc;font-size:14px;margin:15px 0 10px}
p{color:#8b949e;margin-bottom:15px}
a{color:#58a6ff}
.cmd{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:12px 15px;margin:8px 0;position:relative;cursor:pointer}
.cmd:hover{border-color:#58a6ff}
.cmd code{display:block;color:#7ee787;font-family:monospace;font-size:13px;word-break:break-all}
.cmd .label{color:#c9d1d9;font-size:13px;margin-bottom:5px;font-weight:500}
.cmd .desc{color:#8b949e;font-size:12px;margin-top:4px}
.cmd button{position:absolute;top:50%;right:10px;transform:translateY(-50%);background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px}
.cmd button:hover{background:#30363d}
.cmd button.copied{background:#238636;border-color:#238636}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:15px 0}
.card{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:15px}
.card.highlight{border-color:#238636}
.card h4{color:#f0f6fc;font-size:14px;margin-bottom:6px}
.card h4 a.highlight{color:#3fb950}
.card p{font-size:13px;margin:0}
.card code{color:#7ee787;font-size:12px}
.tabs{display:flex;gap:5px;margin-bottom:15px;flex-wrap:wrap}
.tab{background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:13px}
.tab:hover,.tab.active{background:#30363d;border-color:#58a6ff}
.tab.highlight{background:#238636;border-color:#238636}
.info-list{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:15px}
.info-list p{margin:5px 0;font-size:13px}
.loading{color:#8b949e;text-align:center;padding:40px}
.footer{margin-top:40px;color:#8b949e;font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="container">
<h1>Ignition Sandbox</h1>
<p>Command reference for Linux environments. Click any command to copy.</p>
<div class="tabs" id="tabs"><div class="loading">Loading...</div></div>
<div id="content"><div class="loading">Loading templates...</div></div>
<h2>Resources</h2>
<div class="grid" id="resources"><div class="loading">Loading...</div></div>
<div class="footer"><p>All scripts run on Debian/Ubuntu Linux.</p></div>
</div>
<script>
const App={manifest:null,cache:{},
async init(){try{this.manifest=await this.load('templates/manifest.json');this.renderTabs();this.renderResources();if(this.manifest.tabs.length)this.showTab(this.manifest.tabs[0].id)}catch(e){document.getElementById('content').innerHTML='<div class="loading">Failed to load</div>'}},
async load(p){if(this.cache[p])return this.cache[p];const r=await fetch(p);if(!r.ok)throw new Error();return this.cache[p]=await r.json()},
renderTabs(){document.getElementById('tabs').innerHTML=this.manifest.tabs.map(t=>`<button class="tab${t.highlight?' highlight':''}" onclick="App.showTab('${t.id}')" data-tab="${t.id}">${t.label}</button>`).join('')},
renderResources(){document.getElementById('resources').innerHTML=this.manifest.resources.map(r=>`<div class="card${r.highlight?' highlight':''}"><h4><a href="${r.href}"${r.highlight?' class="highlight"':''}>${r.title}</a></h4><p>${r.description}</p></div>`).join('')},
async showTab(id){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelector(`[data-tab="${id}"]`)?.classList.add('active');const tab=this.manifest.tabs.find(t=>t.id===id);if(!tab)return;const c=document.getElementById('content');c.innerHTML='<div class="loading">Loading...</div>';try{const d=await this.load('templates/'+tab.src);c.innerHTML=this.render(d)}catch(e){c.innerHTML='<div class="loading">Failed</div>'}},
render(d){let h=`<div><h2>${d.title}</h2>`;if(d.description)h+=`<p>${d.description}</p>`;if(d.commands)h+=d.commands.map(c=>`<div class="cmd" onclick="App.copy(this)"><div class="label">${c.label}</div><code>${c.code}</code>${c.description?`<div class="desc">${c.description}</div>`:''}<button>Copy</button></div>`).join('');if(d.sections)d.sections.forEach(s=>{if(s.title)h+=`<h3>${s.title}</h3>`;if(s.type==='cards')h+='<div class="grid">'+s.items.map(i=>`<div class="card${i.highlight?' highlight':''}"><h4>${i.href?`<a href="${i.href}"${i.target?' target="_blank"':''}${i.highlight?' class="highlight"':''}>${i.title}</a>`:i.title}</h4><p>${i.description||''}</p>${i.note?`<code>${i.note}</code>`:''}</div>`).join('')+'</div>';if(s.type==='commands')h+='<div class="grid">'+s.items.map(i=>`<div class="cmd" onclick="App.copy(this)"><div class="label">${i.label}</div><code>${i.code}</code><button>Copy</button></div>`).join('')+'</div>';if(s.type==='info')h+='<div class="info-list">'+s.content.map(l=>`<p>${l}</p>`).join('')+'</div>'});return h+'</div>'},
copy(el){const code=el.querySelector('code').textContent,btn=el.querySelector('button');navigator.clipboard.writeText(code).then(()=>{btn.textContent='Copied!';btn.classList.add('copied');setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('copied')},2000)})}
};App.init();
</script>
</body>
</html>
